const CAPS = [

const cv = document.getElementById('c'); cv.width = 1080; cv.height = 1920; const ctx = cv.getContext('2d');
const W = 1080, H = 1920;

// ===== Tiện ích =====
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = (x) => Math.pow(clamp(x), 3);

const hash = (n) => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const stepT = (t) => Math.floor(t * 12) / 12; // stop-motion 12 hình/giây

// Vân giấy (pattern) và nền giấy nhàu — tạo một lần
const grainCv = document.createElement('canvas'); grainCv.width = grainCv.height = 256;
(() => { const g = grainCv.getContext('2d'); const im = g.createImageData(256, 256);

const GRAIN = ctx.createPattern(grainCv, 'repeat');
const bgCv = document.createElement('canvas'); bgCv.width = W; bgCv.height = H;
(() => { const g = bgCv.getContext('2d'); g.fillStyle = BG; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) { const cx = hash(i * 3) * W, cy = hash(i * 7) * H, r = 150 + hash(i * 11) * 380; g.beginPath();
    for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + hash(i * 13 + k) * 1.2; g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }

  for (let i = 0; i < 30; i++) { const x = hash(i * 5) * W, y = hash(i * 19) * H, a = hash(i * 23) * Math.PI, L = 200 + hash(i * 29) * 600;
    g.strokeStyle = 'rgba(90,60,30,0.10)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.22)'; g.beginPath(); g.moveTo(x + 2, y + 1); g.lineTo(x + 2 + Math.cos(a) * L, y + 1 + Math.sin(a) * L); g.stroke(); }

// ===== Mảnh giấy =====
// path: hàm vẽ đường viền; mảnh giấy có bóng đổ + vân giấy nhân (multiply)

  ctx.beginPath(); path(); ctx.fillStyle = color; ctx.fill(o.rule || 'nonzero'); ctx.restore();
  ctx.save(); ctx.beginPath(); path(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = o.grain ?? 0.5; ctx.fillStyle = GRAIN; ctx.fill(o.rule || 'nonzero'); ctx.restore();
}
const rr = (x, y, w, h, r) => () => ctx.roundRect(x, y, w, h, r);

  for (let i = 0; i < nx; i++) p.push([x + w * i / nx, y + (hash(seed + i) - 0.5) * j]);
  for (let i = 0; i < ny; i++) p.push([x + w + (hash(seed + 50 + i) - 0.5) * j, y + h * i / ny]);
  for (let i = 0; i < nx; i++) p.push([x + w - w * i / nx, y + h + (hash(seed + 100 + i) - 0.5) * j]);
  for (let i = 0; i < ny; i++) p.push([x + (hash(seed + 150 + i) - 0.5) * j, y + h - h * i / ny]);
  ctx.moveTo(p[0][0], p[0][1]); p.forEach((q) => ctx.lineTo(q[0], q[1])); ctx.closePath();
};

function tape(x, y, w, rot, h = 44) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = 0.8; ctx.beginPath(); torn(-w / 2, -h / 2, w, h, Math.round(x + y), 5, 9)();
  ctx.fillStyle = '#EEDC9E'; ctx.fill(); ctx.globalAlpha = 0.35; ctx.fillStyle = GRAIN; ctx.globalCompositeOperation = 'multiply'; ctx.fill(); ctx.restore();
}
// Rung nhẹ kiểu stop-motion cho từng mảnh
function jit(seed, tq, fn) {
  const f = Math.round(tq * 12); ctx.save(); ctx.translate((hash(seed * 7 + f) - 0.5) * 2.6, (hash(seed * 13 + f) - 0.5) * 2.6);
  ctx.rotate((hash(seed * 3 + f) - 0.5) * 0.006); fn(); ctx.restore();
}
function txt(s, x, y, o = {}) {
  ctx.save(); const sz = o.size || 48; ctx.font = `${o.w || 700} ${sz}px ${o.font || SANS}`; if (o.ls) ctx.letterSpacing = o.ls + 'px';
  const w = ctx.measureText(s).width; if (o.max && w > o.max) ctx.font = `${o.w || 700} ${Math.floor(sz * o.max / w)}px ${o.font || SANS}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = o.color || BLACK; ctx.globalAlpha = o.alpha ?? 1;
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = 14; } ctx.fillText(s, x, y); ctx.restore();
}
const measure = (s, font) => { ctx.save(); ctx.font = font; const w = ctx.measureText(s).width; ctx.restore(); return w; };
// Chữ viết tay hiện dần
function write(s, x, y, p, o = {}) {

}
function penArrow(x1, y1, x2, y2, p, color = PEN) {
  if (p <= 0) return; const ex = lerp(x1, x2, p), ey = lerp(y1, y2, p), mx = (x1 + ex) / 2 + (ey - y1) * 0.15, my = (y1 + ey) / 2 - (ex - x1) * 0.15;

  if (p >= 1) { const a = Math.atan2(ey - my, ex - mx); ctx.beginPath(); ctx.moveTo(ex - 22 * Math.cos(a - 0.5), ey - 22 * Math.sin(a - 0.5)); ctx.lineTo(ex, ey); ctx.lineTo(ex - 22 * Math.cos(a + 0.5), ey - 22 * Math.sin(a + 0.5)); ctx.stroke(); }
  ctx.restore();
}

// ===== Hình minh hoạ từng thời kỳ (toạ độ tuyệt đối trong thẻ giấy x 110–950, y 680–1250) =====
function abacus(u) {
  const fx = 210, fy = 770, fw = 640, fh = 420, dv = fy + 118;
  for (let i = 0; i < 7; i++) { ctx.fillStyle = '#5A3A1E'; ctx.fillRect(fx + 70 + i * 83 - 3, fy + 20, 6, fh - 40); }
  const counts = [2, 0, 4, 1, 3, 0, 2];
  for (let i = 0; i < 7; i++) {
    const x = fx + 70 + i * 83, col = i % 2 ? RED : MUSTARD;
    for (let k = 0; k < 2; k++) { const y = fy + 46 + k * 34; paper(() => { ctx.moveTo(x + 34, y); ctx.ellipse(x, y, 34, 16, 0, 0, Math.PI * 2); }, col, { blur: 4, sx: 3, sy: 5 }); }
    for (let j = 0; j < 5; j++) {
      const rest = fy + fh - 46 - (4 - j) * 34, up = dv + 38 + j * 34;
      const y = j < counts[i] ? lerp(rest, up, easeOut(seg(u, 1.0 + i * 0.28, 1.25 + i * 0.28))) : rest;
      paper(() => { ctx.moveTo(x + 34, y); ctx.ellipse(x, y, 34, 16, 0, 0, Math.PI * 2); }, col, { blur: 4, sx: 3, sy: 5 });
    }

  write('đếm bằng những hạt gỗ', 230, 728, seg(u, 1.6, 2.6), { align: 'left' });
}
function pascaline(u) {
  paper(rr(190, 790, 680, 360, 22), '#C99A3B'); paper(rr(190, 790, 680, 92, 22), '#A97D2C', { shadow: false });
  const v = Math.floor(1642 * easeOut(seg(u, 0.9, 3.2))); const d = String(v).padStart(6, '0');
  for (let i = 0; i < 6; i++) {
    const x = 255 + i * 110;
    paper(rr(x - 30, 808, 60, 58, 6), CREAM, { shadow: false }); txt(d[i], x, 839, { font: SLAB, size: 42, w: 800 });
    paper(circ(x, 1010, 46), CREAM, { blur: 5, sx: 4, sy: 6 });
    const rot = +d[i] * Math.PI / 5;
    for (let k = 0; k < 10; k++) { const a = rot + k * Math.PI / 5; ctx.fillStyle = BLACK; ctx.beginPath(); ctx.arc(x + 32 * Math.cos(a), 1010 + 32 * Math.sin(a), 6, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#6B4A1A'; ctx.beginPath(); ctx.arc(x, 1010, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#6B4A1A'; ctx.beginPath(); ctx.moveTo(x - 8, 1068); ctx.lineTo(x + 8, 1068); ctx.lineTo(x, 1084); ctx.closePath(); ctx.fill();
  }
  write('cộng, trừ bằng bánh răng', 220, 735, seg(u, 1.8, 2.8), { align: 'left' });
}
function engine(u) {
  paper(rr(320, 1150, 560, 34, 6), '#5A3A1E');
  const cols = [440, 610, 780], colors = [TEAL, MUSTARD, RED];
  cols.forEach((x, c) => {
    ctx.fillStyle = '#3A2A1A'; ctx.fillRect(x - 5, 770, 10, 380);
    [830, 950, 1070].forEach((y, r) => { const dir = (c + r) % 2 ? 1 : -1; paper(gearPath(x, y, 56, 12, dir * u * 1.2 + r * 0.3), colors[(c + r) % 3], { rule: 'evenodd', blur: 6, sx: 5, sy: 7 }); });
  });
  for (let k = 0; k < 3; k++) {
    const p = easeOut(seg(u, 0.8 + k * 0.2, 1.1 + k * 0.2)); if (p <= 0) continue;
    ctx.save(); ctx.translate(lerp(-200, 225, p), 870 + k * 95); ctx.rotate(-0.08 + k * 0.06);
    paper(rr(-75, -42, 150, 84, 6), CREAM2, { blur: 5, sx: 4, sy: 6 });
    ctx.fillStyle = BLACK; for (let a = 0; a < 6; a++) for (let b = 0; b < 3; b++) if (hash(k * 31 + a * 7 + b * 3) > 0.45) ctx.fillRect(-60 + a * 22, -28 + b * 22, 10, 14);
    ctx.restore();
  }
  write('thẻ đục lỗ = chương trình', 150, 740, seg(u, 1.6, 2.6), { align: 'left', size: 46 });
  write('Ada Lovelace, 1843', 150, 1215, seg(u, 2.4, 3.2), { align: 'left', size: 46 });
}
function eniac(u, tq) {
  for (let k = 0; k < 5; k++) {
    const p = easeOut(seg(u, 0.45 + k * 0.12, 0.75 + k * 0.12)); if (p <= 0) continue;
    const x = 150 + k * 128, w = 116; ctx.save(); ctx.translate(0, (1 - p) * -500);
    paper(rr(x, 770, w, 400, 6), NAVY); paper(rr(x + 10, 790, w - 20, 250, 4), '#2B3D5E', { shadow: false, grain: 0.3 });
    for (let c = 0; c < 4; c++) for (let r = 0; r < 8; r++) {
      const on = hash(k * 97 + c * 13 + r * 7 + Math.floor(tq * 6)) > 0.42; ctx.save();
      if (on) { ctx.shadowColor = '#FFB648'; ctx.shadowBlur = 12; } ctx.fillStyle = on ? '#F5A541' : '#5E5440';
      ctx.beginPath(); ctx.arc(x + 24 + c * 23, 812 + r * 28, 7, 0, 7); ctx.fill(); ctx.restore();
    }
    [1080, 1115].forEach((y) => [x + 30, x + 58, x + 86].forEach((cx) => { ctx.fillStyle = CREAM2; ctx.beginPath(); ctx.arc(cx, y, 8, 0, 7); ctx.fill(); }));
    ctx.restore();
  }
  ctx.save(); ctx.strokeStyle = BLACK; ctx.lineWidth = 6; ctx.globalAlpha = seg(u, 1.0, 1.3);
  for (let k = 0; k < 4; k++) { const x = 208 + k * 128; ctx.beginPath(); ctx.moveTo(x, 1170); ctx.bezierCurveTo(x + 10, 1215, x + 118, 1215, x + 128, 1170); ctx.stroke(); }

  if (hp > 0) { ctx.save(); ctx.translate(872, 1170); ctx.scale(hp, hp); ctx.translate(-872, -1170);
    paper(() => { ctx.moveTo(894, 909); ctx.arc(872, 909, 22, 0, Math.PI * 2); ctx.roundRect(850, 935, 44, 125, 18); ctx.roundRect(851, 1045, 18, 125, 8); ctx.roundRect(875, 1045, 18, 125, 8); ctx.roundRect(836, 942, 14, 95, 7); ctx.roundRect(894, 942, 14, 95, 7); }, BLACK, { blur: 6 });
    ctx.restore(); }

  paper(rr(305, 880, 70, 140, 6), '#8E9AA0', { shadow: false, grain: 0.3 });

  ctx.strokeStyle = '#9AA0A6'; ctx.lineWidth = 5; [292, 322, 358, 388].forEach((x) => { ctx.beginPath(); ctx.moveTo(x, 1120); ctx.lineTo(x, 1165); ctx.stroke(); });

  if (tp > 0) { ctx.save(); ctx.translate(720, 1060); ctx.scale(tp, tp); ctx.translate(-720, -1060);
    ctx.strokeStyle = '#9AA0A6'; ctx.lineWidth = 5; [[705, 690], [720, 720], [735, 750]].forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(a, 1030); ctx.lineTo(a, 1080); ctx.lineTo(b, 1120); ctx.stroke(); });
    paper(() => { ctx.moveTo(686, 1032); ctx.lineTo(686, 997); ctx.arc(720, 997, 34, Math.PI, 0); ctx.lineTo(754, 1032); ctx.closePath(); }, BLACK, { blur: 5 });
    ctx.restore(); txt('transistor', 720, 1165, { font: HAND, w: 400, size: 42, alpha: seg(u, 1.5, 1.7) }); }

function chip(u) {
  for (let k = 0; k < 8; k++) { const x = 390 + k * 40; paper(rr(x - 9, 836, 18, 44, 4), '#D9A93B', { blur: 3, sx: 2, sy: 3 }); paper(rr(x - 9, 1040, 18, 44, 4), '#D9A93B', { blur: 3, sx: 2, sy: 3 }); }
  paper(rr(370, 860, 320, 200, 14), '#24221F');
  ctx.fillStyle = '#3A3733'; ctx.beginPath(); ctx.arc(370, 960, 20, -Math.PI / 2, Math.PI / 2); ctx.fill();
  txt('4004', 530, 945, { font: SLAB, w: 800, size: 64, color: '#E9E2D0' }); txt('1971', 530, 1008, { font: SLAB, w: 700, size: 30, color: '#A9A190' });
  const mp = easeOut(seg(u, 1.0, 1.9)); const mx = lerp(820, 705, mp), my = lerp(780, 905, mp);
