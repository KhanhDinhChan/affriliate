<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<!-- PHONG CÁCH · SƠ ĐỒ QUY TRÌNH PHẲNG — tuyến GIẢI NHANH 30 GIÂY.
     Nền kem, dải tiêu đề hổ phách, các bước đánh số nối bằng đường dẫn, thẻ phẳng có bóng đặc.
     Vật rơi trong hình minh hoạ chạy đúng 3 giây thật; đáp án là chỗ cam duy nhất. Đề: trung tâm tự soạn. -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Pangolin&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="lib.js"></script>
<script src="fx.js"></script>
<script>
window.SIZE = [1080, 1920];
window.DURATION = 22;

const CREAM = '#FBF4E4', AMBER = '#F5B83D', SHADOW = '#EBD9B2', MUTED = '#8A7A55', RED = '#E5484D', INK = BRAND.ink;
const Q = 'Thả rơi một vật từ độ cao 45 m, lấy g = 10 m/s². Tính thời gian rơi và tốc độ khi chạm đất.';
const STEPS = [
  [3.5, 'TÓM TẮT', 'h = 45 m · g = 10 m/s² · v₀ = 0'],
  [6.5, 'CÔNG THỨC', 'h = ½gt²  ⇒  t = √(2h/g)'],
  [10.0, 'THAY SỐ', 't = √(2·45/10) = √9 = 3 s'],
  [13.5, 'TỐC ĐỘ CHẠM ĐẤT', 'v = g·t = 10·3 = 30 m/s'],
];
const CAPS = [
  [0.3, 3.5, 'Thả rơi một vật từ 45 m. Tính thời gian rơi và tốc độ chạm đất.'],
  [3.5, 6.5, 'Bước 1: tóm tắt. Thả rơi nên vận tốc đầu bằng 0.'],
  [6.5, 10.0, 'Bước 2: từ h = ½gt², suy ra t = √(2h/g).'],
  [10.0, 13.5, 'Bước 3: thay số, t = √9 = 3 giây.'],
  [13.5, 17.0, 'Bước 4: tốc độ chạm đất v = g·t = 30 m/s.'],
  [17.8, 19.5, 'Cẩn thận: quên lấy căn là ra 9 giây, sai ngay!'],
];

const ctx = setupCanvas();
const [W, H] = window.SIZE;
const GROUND = 1330, ROOF = 760, TDROP = 13.8;

function card(x, y, w, h, o = {}) {
  roundRect(ctx, x + 10, y + 12, w, h, 22, o.shadow || SHADOW);
  roundRect(ctx, x, y, w, h, 22, o.fill || '#fff', o.stroke, o.lw || 4);
}
function background(t) {
  ctx.fillStyle = CREAM; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.fillStyle = '#F4E8CC';
  [[120, 1500, 160], [960, 760, 120], [880, 1700, 200], [180, 560, 90]].forEach(([x, y, r], i) => {
    ctx.beginPath(); ctx.arc(x + Math.sin(t * 0.5 + i) * 18, y + Math.cos(t * 0.4 + i * 2) * 14, r, 0, 7); ctx.fill(); });
  ctx.restore();
}
function diagram(t) {
  const p = easeOut(seg(t, 0.8, 1.6)); if (p <= 0) return;
  ctx.save(); ctx.globalAlpha = p; ctx.translate(0, (1 - p) * 60);
  ctx.fillStyle = '#C9D4E8'; ctx.fillRect(70, ROOF, 92, GROUND - ROOF);
  ctx.fillStyle = '#AFC0DC'; ctx.fillRect(62, ROOF - 14, 108, 14);
  ctx.fillStyle = CREAM; for (let r = 0; r < 9; r++) for (let c = 0; c < 2; c++) ctx.fillRect(86 + c * 40, ROOF + 30 + r * 60, 22, 30);
  ctx.fillStyle = INK; ctx.fillRect(40, GROUND, 260, 6);
  // kích thước h
  ctx.strokeStyle = BRAND.phys.s; ctx.fillStyle = BRAND.phys.s; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(262, ROOF); ctx.lineTo(262, GROUND); ctx.stroke();
  [[ROOF, 1], [GROUND, -1]].forEach(([y, d]) => { ctx.beginPath(); ctx.moveTo(262, y); ctx.lineTo(250, y + 18 * d); ctx.lineTo(274, y + 18 * d); ctx.closePath(); ctx.fill(); });
  ctx.save(); ctx.translate(262, (ROOF + GROUND) / 2); ctx.rotate(-Math.PI / 2); roundRect(ctx, -92, -24, 184, 48, 24, CREAM);
  text(ctx, 'h = 45 m', 0, 2, { size: 36, weight: 800, color: '#51627A' }); ctx.restore();
  // vật rơi: đúng 3 giây thật, y = ½gt² theo tỉ lệ
  const tau = clamp(t - TDROP, 0, 3); const y = ROOF - 22 + (GROUND - 22 - (ROOF - 22)) * (tau / 3) ** 2;
  if (tau > 0 && tau < 3) vector(ctx, 205, y + 24, 205, y + 24 + 20 + 150 * tau / 3, BRAND.phys.v, 'v', { width: 8, lx: -48, ly: 0 });
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(205, y, 22, 0, 7); ctx.fill();
  if (t > TDROP - 0.3) { const k = seg(t, TDROP - 0.3, TDROP); roundRect(ctx, 115, 676, 180, 52, 26, INK);
    text(ctx, `t = ${tau.toFixed(1).replace('.', ',')} s`, 205, 703, { size: 32, weight: 800, color: '#fff', alpha: k }); }
  ctx.restore();
}
function stopwatch(t) {
  const p = backOut(seg(t, 0.6, 1.1)); if (p <= 0) return;
  ctx.save(); ctx.translate(970, 448); ctx.scale(p, p);
  ctx.beginPath(); ctx.arc(0, 0, 46, 0, 7); ctx.fillStyle = INK; ctx.fill();
  ctx.strokeStyle = AMBER; ctx.lineWidth = 8; ctx.lineCap = 'round'; const e = clamp(t / 30);
  ctx.beginPath(); ctx.arc(0, 0, 34, -Math.PI / 2, -Math.PI / 2 + e * Math.PI * 2); ctx.stroke();
  text(ctx, String(Math.min(30, Math.floor(t))), 0, 2, { size: 34, weight: 800, color: '#fff' });
  ctx.restore();
}
function steps(t) {
  STEPS.forEach(([t0, label, f], i) => {
    const y = 660 + i * 170; const p = backOut(seg(t, t0, t0 + 0.55)); if (seg(t, t0, t0 + 0.55) <= 0) return;
    // đường nối từ bước trước, có chấm chạy
    if (i > 0) { const k = seg(t, t0 - 0.3, t0 + 0.1); ctx.save(); ctx.strokeStyle = BRAND.primary; ctx.lineWidth = 5; ctx.setLineDash([12, 10]);
      ctx.beginPath(); ctx.moveTo(385, y - 20); ctx.lineTo(385, y - 20 + 30 * k); ctx.stroke(); ctx.restore(); }
    ctx.save(); ctx.translate((1 - p) * 700, 0); ctx.globalAlpha = clamp(p * 1.5);
    const active = t < (STEPS[i + 1]?.[0] ?? 17.0);
    card(330, y, 600, 150, { stroke: active ? AMBER : null, lw: 5 });
    const s = backOut(seg(t, t0 + 0.2, t0 + 0.6)); ctx.save(); ctx.translate(385, y + 75); ctx.scale(s, s);
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fillStyle = BRAND.primary; ctx.fill();
    text(ctx, String(i + 1), 0, 3, { size: 40, weight: 800, color: '#fff' }); ctx.restore();
    text(ctx, label, 446, y + 46, { size: 28, weight: 800, color: MUTED, align: 'left' });
    text(ctx, f, 446, y + 102, { size: 44, weight: 800, color: INK, align: 'left', maxWidth: 460, reveal: seg(t, t0 + 0.3, t0 + 1.3) });
    ctx.restore();
  });
}

window.renderAt = (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  const [sx, sy] = shakeAt(t, 17.0, 12, 0.25); ctx.translate(sx, sy);
  background(t);
  // dải tiêu đề hổ phách mọc ngang
  const b = easeOut(seg(t, 0.1, 0.6)); roundRect(ctx, 60, 318, 960 * b, 70, 16, AMBER);
  text(ctx, 'RƠI TỰ DO · BÀI 1', 92, 355, { size: 40, weight: 800, color: INK, align: 'left', alpha: seg(t, 0.4, 0.8) });
  // thẻ đề bài
  const q = backOut(seg(t, 0.3, 0.9)); ctx.save(); ctx.translate(0, (1 - q) * -80); ctx.globalAlpha = clamp(q * 1.4);
  card(60, 420, 960, 210); paragraph(ctx, Q, 515, 480, 780, { size: 44, weight: 600, color: INK }); ctx.restore();
  stopwatch(t);
  diagram(t);
  steps(t);
  // đáp án: con dấu cam đóng lên đề bài
  const st = seg(t, 17.0, 17.35);
  if (st > 0) { const s = lerp(1.7, 1, easeOut(st)); ctx.save(); ctx.translate(540, 525); ctx.rotate(-0.05); ctx.scale(s, s); ctx.globalAlpha = clamp(st * 2);
    roundRect(ctx, -400, -70, 800, 140, 26, BRAND.accent); text(ctx, 't = 3 s   ·   v = 30 m/s', 0, 4, { size: 62, weight: 800, color: '#fff' }); ctx.restore(); }
  // bẫy thường gặp
  const tr = backOut(seg(t, 17.8, 18.3));
  if (seg(t, 17.8, 18.3) > 0) {
    ctx.save(); ctx.globalAlpha = 0.75 * clamp(seg(t, 17.8, 18.1)); ctx.fillStyle = CREAM; ctx.fillRect(0, 650, W, 700); ctx.restore();
    ctx.save(); ctx.translate(540, 990); ctx.scale(tr, tr);
    card(-400, -100, 800, 200, { stroke: RED, lw: 6 });
    text(ctx, 'BẪY THƯỜNG GẶP', 0, -50, { size: 32, weight: 800, color: RED });
    text(ctx, 'Quên lấy căn  →  t = 9 s', -30, 30, { size: 54, weight: 800, color: INK });
    ctx.strokeStyle = RED; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(300, 8); ctx.lineTo(344, 52); ctx.moveTo(344, 8); ctx.lineTo(300, 52); ctx.stroke();
    ctx.restore();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  brandBug(ctx, false); seriesTag(ctx, 'GIẢI NHANH 30 GIÂY', BRAND.primary);
  captionAt(ctx, t, CAPS, false);
  progressBar(ctx, t);
  endCard(ctx, t, 19.6, false);
};
window.renderAt(0);
</script>
</body></html>
