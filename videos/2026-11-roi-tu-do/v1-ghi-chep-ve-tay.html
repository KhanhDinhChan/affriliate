<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<!-- PHONG CÁCH · GHI CHÉP VẼ TAY — tuyến HIỂU BẢN CHẤT.
     Giấy ngà chấm lưới, nét bút mực xanh đen rung nhẹ 12 lần/giây, ngòi bút viết từng chữ,
     mỗi khung chỉ một chỗ màu cam. Vectơ vẫn theo bảng màu đại lượng (F đỏ hồng, a tím). -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Pangolin&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="lib.js"></script>
<script src="fx.js"></script>
<script>
window.SIZE = [1080, 1920];
window.DURATION = 19;
window.ready = Promise.all([window.ready, document.fonts.load('60px "Patrick Hand"')]);

const INK = '#22305A', PAPER = '#F4F0E6', ORANGE = BRAND.accent;
const HAND = '"Patrick Hand", "Pangolin", sans-serif';
const CAPS = [
  [0.3, 3.2, 'Búa và lông chim: thả cùng lúc, cái nào chạm đất trước?'],
  [3.2, 5.4, 'Trong không khí, lông chim bị lực cản giữ lại.'],
  [5.4, 7.5, 'Nên ta dễ tưởng vật nặng rơi nhanh hơn.'],
  [7.5, 10.2, 'Giờ hút hết không khí trong ống ra…'],
  [10.2, 12.5, 'Hai vật rơi song song và chạm đáy cùng lúc!'],
  [12.5, 16.4, 'Mọi vật rơi tự do với cùng gia tốc g, dù nặng hay nhẹ.'],
];

const ctx = setupCanvas();
const [W, H] = window.SIZE;
const GROUND = 1330;

// Giấy: tạo một lần rồi dùng lại (không tính lại từng khung)
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
(() => {
  const g = paper.getContext('2d'); g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(34,48,90,0.10)';
  for (let y = 40; y < H; y += 48) for (let x = 36; x < W; x += 48) { g.beginPath(); g.arc(x, y, 2, 0, 7); g.fill(); }
  for (let i = 0; i < 26000; i++) { g.fillStyle = `rgba(90,70,40,${0.02 + hash(i) * 0.05})`; g.fillRect(hash(i * 3) * W, hash(i * 7) * H, 1.5, 1.5); }
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(80,60,30,0.16)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
})();

// ===== Hình vẽ (toạ độ: x giữa, y đỉnh) =====
function hammerStrokes(x, y) {
  return [rectPts(x - 72, y, 144, 48, 5), linePts(x - 50, y + 12, x + 50, y + 12, 6),
    [...linePts(x - 11, y + 48, x - 11, y + 196, 8), ...linePts(x - 11, y + 196, x + 11, y + 196, 2).slice(1), ...linePts(x + 11, y + 196, x + 11, y + 48, 8).slice(1)],
    linePts(x - 11, y + 150, x + 11, y + 150, 2), linePts(x - 11, y + 165, x + 11, y + 165, 2)];
}
function featherStrokes(x, y) {
  const s = [quadPts(x + 6, y + 205, x - 14, y + 100, x + 20, y - 4, 16),
    quadPts(x + 18, y + 2, x - 78, y + 60, x - 2, y + 168, 16), quadPts(x + 22, y + 2, x + 80, y + 84, x + 6, y + 172, 16)];
  for (let i = 0; i < 6; i++) { const yy = y + 30 + i * 24; const xc = x + 4 - i * 2; s.push(linePts(xc, yy, xc - 34 + i * 3, yy - 20, 3)); s.push(linePts(xc + 2, yy + 8, xc + 38 - i * 3, yy - 12, 3)); }
  return s;
}
// Ngòi bút đi theo nét viết
function pen(tip, t) {
  if (!tip) return;
  const [x, y] = tip; ctx.save(); ctx.translate(x + Math.sin(t * 40) * 1.5, y + Math.cos(t * 33) * 1.5); ctx.rotate(-0.95);
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.roundRect(14, 8, 270, 26, 12); ctx.fill();
  ctx.fillStyle = '#9AA4B8'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(34, -11); ctx.lineTo(34, 11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(32, -13, 250, 26, 10); ctx.fill();
  ctx.fillStyle = '#3B4C80'; ctx.fillRect(60, -13, 40, 26);
  ctx.restore();
}
// Mũi tên vẽ tay (rung nhẹ) theo màu đại lượng
function handArrow(x1, y1, x2, y2, color, p, t, seed) {
  const a = Math.atan2(y2 - y1, x2 - x1); const hx = x2 - 26 * Math.cos(a - 0.5), hy = y2 - 26 * Math.sin(a - 0.5), kx = x2 - 26 * Math.cos(a + 0.5), ky = y2 - 26 * Math.sin(a + 0.5);
  return sketchStrokes(ctx, [linePts(x1, y1, x2, y2, 6), [[hx, hy], [x2, y2], [kx, ky]]], p, { t, seed, color, width: 7 });
}
function ground(p, t) { return sketchStrokes(ctx, [linePts(110, GROUND, 970, GROUND, 14), ...Array.from({ length: 16 }, (_, i) => linePts(130 + i * 54, GROUND + 4, 110 + i * 54, GROUND + 28, 1))], p, { t, seed: 9, width: 5 }); }

// ===== CẢNH A · Trong không khí (0 – 7.5 s) =====
function sceneA(t, tips) {
  tips.push(writeText(ctx, 'Búa và lông chim', W / 2, 400, seg(t, 0.3, 1.3), { size: 104, font: HAND }));
  tips.push(writeText(ctx, 'cái nào rơi nhanh hơn?', W / 2, 492, seg(t, 1.3, 2.3), { size: 76, font: HAND }));
  tips.push(writeText(ctx, '① Trong không khí', 110, 590, seg(t, 3.2, 3.9), { size: 62, font: HAND, align: 'left' }));
  tips.push(ground(seg(t, 2.3, 3.0), t));
  // búa: rơi nhanh từ 4.0 s, chạm đất 4.8 s
  const u = clamp(t - 4.0, 0, 0.8); const hy = 700 + 0.5 * 1406 * u * u;
  tips.push(sketchStrokes(ctx, hammerStrokes(320, Math.min(hy, GROUND - 196)), seg(t, 1.0, 2.0), { t, seed: 2 }));
  if (t > 4.8 && t < 5.6) { const k = seg(t, 4.8, 5.6); ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    for (let i = 0; i < 5; i++) { const a = Math.PI + i * Math.PI / 4; ctx.beginPath(); ctx.moveTo(320 + Math.cos(a) * (90 + 50 * k), GROUND - 6 + Math.sin(a) * (20 + 30 * k)); ctx.lineTo(320 + Math.cos(a) * (120 + 60 * k), GROUND - 6 + Math.sin(a) * (30 + 40 * k)); ctx.stroke(); } ctx.restore(); }
  // lông chim: trôi chậm, đung đưa
  const d = Math.max(0, t - 4.0); const fx = 740 + 46 * Math.sin(2.2 * d), fy = 700 + 62 * d; const rot = 0.28 * Math.sin(2.2 * d + 0.6);
  ctx.save(); ctx.translate(fx, fy + 100); ctx.rotate(rot); ctx.translate(-fx, -fy - 100);
  tips.push(sketchStrokes(ctx, featherStrokes(fx, fy), seg(t, 1.6, 2.6), { t, seed: 4 }));
  ctx.restore();
  tips.push(writeText(ctx, 'nặng', 430, 760, seg(t, 2.4, 2.9), { size: 52, font: HAND, align: 'left', alpha: 1 - seg(t, 3.9, 4.1) }));
  tips.push(writeText(ctx, 'nhẹ', 830, 760, seg(t, 2.7, 3.2), { size: 52, font: HAND, align: 'left', alpha: 1 - seg(t, 3.9, 4.1) }));
  // lực cản không khí (F, đỏ hồng) đẩy ngược lên lông chim
  if (t > 4.5) {
    tips.push(handArrow(fx + 4, fy + 40, fx + 4, fy - 90, BRAND.phys.F, seg(t, 4.5, 5.0), t, 7));
    tips.push(writeText(ctx, 'F cản', fx + 30, fy - 60, seg(t, 4.9, 5.4), { size: 50, font: HAND, align: 'left', color: BRAND.phys.F }));
  }
}

// ===== CẢNH B · Trong chân không (7.5 – 12.5 s) =====
const T0B = 9.2, TFB = 1.6, DROPB = 430, GB = 2 * DROPB / (TFB * TFB);
const dropB = (t) => { const u = clamp(t - T0B, 0, TFB); return 0.5 * GB * u * u; };
function sceneB(t, tips) {
  tips.push(writeText(ctx, '② Trong chân không', 110, 540, seg(t, 7.8, 8.5), { size: 62, font: HAND, align: 'left' }));
  tips.push(sketchStrokes(ctx, [rectPts(250, 660, 580, 670, 8), rectPts(266, 676, 548, 638, 8), rectPts(510, 628, 60, 32, 2)], seg(t, 7.9, 8.8), { t, seed: 11, width: 5 }));
  tips.push(writeText(ctx, '← hút hết không khí', 588, 612, seg(t, 8.6, 9.3), { size: 44, font: HAND, align: 'left' }));
  // vệt hoạt nghiệm: mỗi 0,2 s ghi một chấm, nối hai chấm cùng thời điểm
  for (let s = 0; s <= TFB + 1e-6; s += 0.2) {
    if (t < T0B + s) break; const y = 790 + 0.5 * GB * s * s;
    ctx.save(); ctx.globalAlpha = 0.5; ctx.setLineDash([10, 10]); ctx.strokeStyle = BRAND.phys.s; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(400, y); ctx.lineTo(690, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = INK; [400, 690].forEach((x) => { ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill(); }); ctx.restore();
  }
  const dy = dropB(t);
  tips.push(sketchStrokes(ctx, hammerStrokes(400, 700 + dy), seg(t, 8.4, 9.0), { t, seed: 2 }));
  tips.push(sketchStrokes(ctx, featherStrokes(690, 700 + dy), seg(t, 8.6, 9.2), { t, seed: 4 }));
  // CÙNG LÚC! — chỗ màu cam duy nhất của khung
  tips.push(writeText(ctx, 'CÙNG LÚC!', W / 2, 420, seg(t, 10.9, 11.6), { size: 120, font: HAND, color: ORANGE }));
  tips.push(sketchStrokes(ctx, [ellipsePts(W / 2, 422, 300, 86, 30, -2.6, Math.PI * 2.15)], seg(t, 11.5, 12.1), { t, seed: 6, color: ORANGE, width: 6 }));
}

// ===== CẢNH C · Kết luận (12.5 – 16.5 s) =====
function sceneC(t, tips) {
  tips.push(writeText(ctx, 'a = g ≈ 9,8 m/s²', W / 2, 560, seg(t, 12.8, 13.8), { size: 112, font: HAND }));
  const wav = []; for (let i = 0; i <= 40; i++) wav.push([200 + i * 17, 642 + Math.sin(i * 0.9) * 7]);
  tips.push(sketchStrokes(ctx, [wav], seg(t, 13.8, 14.2), { t, seed: 3, width: 5 }));
  ctx.save(); ctx.translate(360, 780); ctx.scale(0.72, 0.72); sketchStrokes(ctx, hammerStrokes(0, 0), seg(t, 13.6, 14.1), { t, seed: 2 }); ctx.restore();
  ctx.save(); ctx.translate(720, 780); ctx.scale(0.72, 0.72); sketchStrokes(ctx, featherStrokes(0, 0), seg(t, 13.7, 14.2), { t, seed: 4 }); ctx.restore();
  tips.push(handArrow(470, 820, 470, 1000, BRAND.phys.a, seg(t, 14.1, 14.5), t, 21));
  tips.push(handArrow(830, 820, 830, 1000, BRAND.phys.a, seg(t, 14.2, 14.6), t, 22));
  writeText(ctx, 'a', 492, 920, seg(t, 14.4, 14.6), { size: 56, font: HAND, align: 'left', color: BRAND.phys.a });
  writeText(ctx, 'a', 852, 920, seg(t, 14.5, 14.7), { size: 56, font: HAND, align: 'left', color: BRAND.phys.a });
  tips.push(writeText(ctx, 'không phụ thuộc khối lượng', W / 2, 1130, seg(t, 14.6, 15.4), { size: 72, font: HAND, color: ORANGE, maxWidth: 860 }));
  tips.push(writeText(ctx, '※ Galileo đã chỉ ra điều này gần 400 năm trước', W / 2, 1230, seg(t, 15.4, 16.1), { size: 44, font: HAND, maxWidth: 860 }));
}

// Chuyển cảnh: đẩy ngang (A→B), đẩy dọc (B→C)
window.renderAt = (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.drawImage(paper, 0, 0);
  const tips = [];
  const pAB = easeInOut(seg(t, 7.35, 7.8)), pBC = easeInOut(seg(t, 12.35, 12.8));
  if (t < 7.8) { ctx.save(); ctx.translate(-W * pAB, 0); sceneA(t, tips); ctx.restore(); }
  if (t >= 7.35 && t < 12.8) { ctx.save(); ctx.translate(W * (1 - pAB), -H * pBC); sceneB(t, tips); ctx.restore(); }
  if (t >= 12.35) { ctx.save(); ctx.translate(0, H * (1 - pBC)); sceneC(t, tips); ctx.restore(); }
  pen(tips.filter(Boolean).pop(), t);
  brandBug(ctx, false); seriesTag(ctx, 'HIỂU BẢN CHẤT', BRAND.primary);
  captionAt(ctx, t, CAPS, false);
  progressBar(ctx, t);
  endCard(ctx, t, 16.6, false);
};
window.renderAt(0);
</script>
</body></html>
