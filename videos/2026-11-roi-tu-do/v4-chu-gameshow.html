<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<!-- PHONG CÁCH · CHỮ GAMESHOW 9:16 — tuyến SAI LẦM KINH ĐIỂN (dạng đố vui, kéo tương tác).
     Chữ viền nhiều lớp, bật lò xo, tia nắng xoay, chấm halftone, giọt mồ hôi, lấp lánh, rung khung khi va chạm.
     Hai vật rơi với cùng gia tốc trong cảnh xem chậm; đáp án đúng là chỗ cam duy nhất. -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Pangolin&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="lib.js"></script>
<script src="fx.js"></script>
<script>
window.SIZE = [1080, 1920];
window.DURATION = 20;
window.ready = Promise.all([window.ready, document.fonts.load('800 80px "Baloo 2"')]);

const DARK = '#2B1B4A', PINK = '#FF5FA2', YELLOW = '#FFE14D', CYAN = '#22C7E8';
const BALOO = '"Baloo 2", "Be Vietnam Pro", sans-serif';
const CAPS = [
  [2.3, 4.6, 'Thả quả tạ 5 kg và quả bóng tennis cùng lúc từ độ cao 1 m.'],
  [4.6, 6.6, 'Cái nào chạm đất trước? Bạn có 3 giây!'],
  [6.6, 8.3, 'Nhiều bạn chọn quả tạ, vì nó nặng hơn…'],
  [8.3, 11.6, 'Xem chậm nhé!'],
  [11.6, 14.0, 'Hai vật chạm đất cùng lúc!'],
  [14.0, 17.5, 'Mọi vật rơi với cùng gia tốc g. Sức cản không khí ở đây rất nhỏ.'],
];

const ctx = setupCanvas();
const [W, H] = window.SIZE;
const FLOOR = 1283, T0 = 8.9, TF = 2.0, DROP = FLOOR - 835;
const fall = (t) => { const u = clamp(t - T0, 0, TF); return DROP * (u / TF) ** 2; };

// Chữ gameshow: bóng đổ + viền tối + viền trắng + ruột màu chuyển sắc
function bubble(s, x, y, size, fill, o = {}) {
  const sc = o.scale ?? 1; if (sc <= 0.01) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale(sc, sc);
  ctx.font = `800 ${size}px ${BALOO}`; let w = ctx.measureText(s).width;
  if (o.maxWidth && w > o.maxWidth) { size = Math.floor(size * o.maxWidth / w); ctx.font = `800 ${size}px ${BALOO}`; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.globalAlpha = o.alpha ?? 1;
  const yo = size * 0.06;
  ctx.strokeStyle = DARK; ctx.fillStyle = DARK; ctx.lineWidth = size * 0.24; ctx.strokeText(s, 0, yo + size * 0.07); ctx.fillText(s, 0, yo + size * 0.07);
  ctx.lineWidth = size * 0.2; ctx.strokeText(s, 0, yo);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = size * 0.09; ctx.strokeText(s, 0, yo);
  const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2); g.addColorStop(0, o.top || '#fff'); g.addColorStop(0.45, fill); g.addColorStop(1, fill);
  ctx.fillStyle = g; ctx.fillText(s, 0, yo);
  ctx.restore();
}
function sticker(x, y, w, h, sc, draw, rot = 0) {
  if (sc <= 0.01) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  roundRect(ctx, -w / 2 + 8, -h / 2 + 10, w, h, h / 2.4, DARK); roundRect(ctx, -w / 2, -h / 2, w, h, h / 2.4, '#fff', DARK, 6);
  draw(); ctx.restore();
}
function burst(x, y, R, sc, rot, color) {
  if (sc <= 0) return; ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc); ctx.beginPath();
  for (let i = 0; i < 32; i++) { const a = i * Math.PI / 16; const r = i % 2 ? R * 0.72 : R; ctx.lineTo(r * Math.cos(a), r * Math.sin(a)); }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = DARK; ctx.lineWidth = 8; ctx.stroke(); ctx.restore();
}
function background(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#FFE58A'); g.addColorStop(1, '#FFC2DA'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(540, 820); ctx.rotate(t * 0.15); ctx.fillStyle = 'rgba(255,255,255,0.28)';
  for (let i = 0; i < 18; i++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 1600, i * Math.PI / 9, i * Math.PI / 9 + Math.PI / 18); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,95,162,0.22)';
  for (let y = 0; y < 420; y += 34) for (let x = 0; x < 420; x += 34) { const r = 12 * (1 - Math.hypot(x, y) / 460); if (r > 0) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(W - x, H - y, r, 0, 7); ctx.fill(); } }
}
function dumbbell(x, y, sc = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  roundRect(ctx, -95, -9, 190, 18, 9, '#5B6070', DARK, 5);
  [-1, 1].forEach((d) => { roundRect(ctx, d * 58 - 15, -45, 30, 90, 10, '#3A3F4B', DARK, 6); roundRect(ctx, d * 88 - 11, -32, 22, 64, 8, '#4A5060', DARK, 6); });
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-64, -36, 6, 50); ctx.fillRect(52, -36, 6, 50);
  ctx.restore();
}
function tennis(x, y, sc = 1, spin = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate(spin);
  ctx.beginPath(); ctx.arc(0, 0, 52, 0, 7); ctx.fillStyle = '#D4EE3A'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = DARK; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, 49, 0, 7); ctx.clip(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(-70, 0, 52, -1.0, 1.0); ctx.stroke(); ctx.beginPath(); ctx.arc(70, 0, 52, Math.PI - 1.0, Math.PI + 1.0); ctx.stroke(); ctx.restore();
  ctx.restore();
}
function option(y, letter, label, color, sc, o = {}) {
  sticker(540, y, 740, 76, sc, () => {
    if (o.hl) { ctx.lineWidth = 8; ctx.strokeStyle = o.hl; ctx.beginPath(); ctx.roundRect(-370, -38, 740, 76, 32); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(-322, 0, 26, 0, 7); ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = DARK; ctx.stroke();
    text(ctx, letter, -322, 3, { size: 34, weight: 800, color: '#fff', font: BALOO });
    text(ctx, label, -270, 5, { size: 44, weight: 800, color: DARK, align: 'left', font: BALOO });
  }, o.rot || 0);
}

window.renderAt = (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  const [sx, sy] = shakeAt(t, 10.9, 22, 0.35); ctx.translate(sx, sy);
  background(t);
  // ── CẢNH 1 · Tiêu đề bật ra
  if (t < 2.4) {
    const out = 1 - easeInOut(seg(t, 2.05, 2.35));
    burst(540, 830, 330, spring(t, 0.1) * out, t * 0.5, PINK);
    bubble('ĐỐ VUI', 540, 760, 180, YELLOW, { scale: spring(t, 0.25) * out, rot: -0.06 });
    bubble('5 GIÂY!', 540, 930, 150, CYAN, { scale: spring(t, 0.5) * out, rot: 0.05 });
    [[200, 560, 0.6], [880, 640, 0.9], [230, 1080, 1.2], [860, 1060, 0.4]].forEach(([x, y, ph]) => sparkle(ctx, x, y, 40 * Math.abs(Math.sin(t * 4 + ph)) * out, '#fff'));
  }
  // ── CẢNH 2–5
  if (t >= 2.3) {
    const outQ = easeInOut(seg(t, 8.3, 8.65));
    // câu đề
    sticker(540, 470, 880, 100, spring(t, 2.35) * (1 - outQ), () => text(ctx, 'Thả cùng lúc từ độ cao 1 m', 0, 4, { size: 52, weight: 800, color: DARK, font: BALOO }));
    // xem chậm
    if (t > 8.3 && t < 11.6) sticker(540, 470, 520, 96, spring(t, 8.4) * (1 - seg(t, 11.3, 11.6)), () => {
      ctx.globalAlpha = Math.floor(t * 3) % 2 ? 1 : 0.3; ctx.beginPath(); ctx.arc(-200, 0, 16, 0, 7); ctx.fillStyle = '#E5484D'; ctx.fill(); ctx.globalAlpha = 1;
      text(ctx, 'XEM CHẬM ×0,25', 20, 4, { size: 50, weight: 800, color: DARK, font: BALOO }); });
    // sàn
    const fl = easeOut(seg(t, 8.4, 8.8)); if (fl > 0) { roundRect(ctx, 540 - 420 * fl, FLOOR, 840 * fl, 16, 8, DARK); }
    // hai vật: cùng độ dời ở mọi thời điểm (cùng gia tốc)
    const dy = fall(t); const bob = t < T0 ? Math.sin(t * 3) * 6 : 0;
    const k = 1 - Math.min(1, dy / DROP);
    if (fl > 0) [330, 750].forEach((x) => { ctx.save(); ctx.globalAlpha = 0.25 + 0.35 * (1 - k); ctx.fillStyle = DARK; ctx.beginPath(); ctx.ellipse(x, FLOOR, 80 - 30 * k, 12 - 4 * k, 0, 0, 7); ctx.fill(); ctx.restore(); });
    if (t > T0 && t < T0 + TF) [330, 750].forEach((x) => { ctx.save(); ctx.strokeStyle = DARK; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.globalAlpha = 0.5;
      [-40, 0, 40].forEach((o, i) => { const L = 30 + 50 * seg(t, T0, T0 + TF); ctx.beginPath(); ctx.moveTo(x + o, 735 + dy - 30 - i * 8); ctx.lineTo(x + o, 735 + dy - 30 - i * 8 - L); ctx.stroke(); }); ctx.restore(); });
    dumbbell(330, 790 + dy + bob, spring(t, 2.6));
    tennis(750, 783 + dy + bob * 0.8, spring(t, 2.9), t > T0 ? (t - T0) * 1.2 : 0);
    sticker(330, 905, 300, 70, spring(t, 2.75) * (1 - outQ), () => text(ctx, 'Quả tạ 5 kg', 0, 4, { size: 44, weight: 800, color: DARK, font: BALOO }), -0.03);
    sticker(750, 905, 300, 70, spring(t, 3.05) * (1 - outQ), () => text(ctx, 'Bóng tennis', 0, 4, { size: 44, weight: 800, color: DARK, font: BALOO }), 0.03);
    ctx.save(); ctx.letterSpacing = '3px'; bubble('CÁI NÀO CHẠM ĐẤT TRƯỚC?', 540, 1020, 66, YELLOW, { scale: spring(t, 3.4) * (1 - outQ), maxWidth: 880 }); ctx.restore();
    const wig = t > 6.6 && t < 8.3 ? Math.sin(t * 22) * 0.03 : 0;
    option(1120, 'A', 'Quả tạ chạm trước', PINK, spring(t, 3.8) * (1 - outQ), { rot: wig, hl: t > 6.6 ? PINK : null });
    option(1210, 'B', 'Bóng tennis chạm trước', CYAN, spring(t, 4.1) * (1 - outQ));
    option(1300, 'C', 'Cùng lúc', BRAND.phys.a, spring(t, 4.4) * (1 - outQ));
    // đếm ngược 3-2-1
    [[4.9, '3'], [5.5, '2'], [6.1, '1']].forEach(([t0, n]) => { if (t >= t0 && t < t0 + 0.6) {
      const s = spring(t, t0); ctx.save(); ctx.translate(900, 600); ctx.scale(s, s); ctx.beginPath(); ctx.arc(0, 0, 78, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = DARK; ctx.stroke();
      ctx.lineWidth = 10; ctx.strokeStyle = PINK; ctx.beginPath(); ctx.arc(0, 0, 62, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - (t - t0) / 0.6)); ctx.stroke(); ctx.restore();
      bubble(n, 900, 600, 100, PINK, { scale: s }); } });
    // "Nhiều bạn chọn A…" + giọt mồ hôi
    if (t > 6.6 && t < 8.35) {
      const s = spring(t, 6.6) * (1 - seg(t, 8.1, 8.35));
      sticker(540, 625, 560, 90, s, () => text(ctx, 'Nhiều bạn chọn A…', 0, 4, { size: 50, weight: 800, color: DARK, font: BALOO }), -0.04);
      bubble('Ơ…?', 160, 600, 70, PINK, { scale: spring(t, 7.2) * (1 - seg(t, 8.1, 8.35)), rot: -0.15 });
      const d = spring(t, 7.0) * (1 - seg(t, 8.1, 8.35)); const dyd = ((t - 7.0) * 60) % 50;
      if (d > 0) { ctx.save(); ctx.translate(860, 560 + dyd); ctx.scale(d, d); ctx.beginPath(); ctx.moveTo(0, -38); ctx.quadraticCurveTo(26, 0, 0, 18); ctx.quadraticCurveTo(-26, 0, 0, -38);
        ctx.fillStyle = '#7FD3FF'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = DARK; ctx.stroke(); ctx.restore(); }
    }
    // va chạm: BỤP! + bụi
    if (t > 10.9 && t < 11.6) {
      const k2 = seg(t, 10.9, 11.6);
      [330, 750].forEach((x) => { for (let i = 0; i < 5; i++) { const a = Math.PI + (i + 0.5) * Math.PI / 5; ctx.save(); ctx.globalAlpha = 1 - k2; ctx.fillStyle = '#fff'; ctx.strokeStyle = DARK; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(x + Math.cos(a) * (60 + 90 * k2), FLOOR - 10 + Math.sin(a) * (20 + 50 * k2), 16 * (1 - k2 * 0.5), 0, 7); ctx.fill(); ctx.stroke(); ctx.restore(); } });
      bubble('BỤP!', 540, 1080, 150, YELLOW, { scale: spring(t, 10.9) * (1 - seg(t, 11.35, 11.6)), rot: -0.08 });
    }
    // đáp án đúng (chỗ cam duy nhất)
    if (t > 11.6) {
      const s = spring(t, 11.6);
      sticker(540, 660, 640, 120, s, () => { roundRect(ctx, -320, -60, 640, 120, 50, BRAND.accent, DARK, 6); text(ctx, 'C. CÙNG LÚC', 0, 6, { size: 72, weight: 800, color: '#fff', font: BALOO }); });
      bubble('ĐÚNG RỒI!', 540, 520, 120, YELLOW, { scale: spring(t, 11.75), rot: -0.06 });
      [[170, 470, 0], [910, 520, 1], [190, 760, 2], [900, 760, 3]].forEach(([x, y, ph]) => sparkle(ctx, x, y, 44 * Math.abs(Math.sin((t - 11.6) * 5 + ph)) * seg(t, 11.6, 11.9), '#fff'));
    }
    // giải thích
    if (t > 14.0) {
      sticker(540, 960, 900, 190, spring(t, 14.0), () => {
        text(ctx, 'Mọi vật rơi cùng gia tốc g', 0, -30, { size: 62, weight: 800, color: DARK, font: BALOO, maxWidth: 820 });
        text(ctx, '(sức cản không khí ở đây rất nhỏ)', 0, 46, { size: 38, weight: 600, color: '#6B5A86' }); });
      [[330, 14.4], [750, 14.6]].forEach(([x, t0]) => sticker(x, 1130, 170, 66, spring(t, t0), () => text(ctx, 'a = g', 0, 4, { size: 42, weight: 800, color: BRAND.phys.a, font: BALOO })));
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  brandBug(ctx, false); seriesTag(ctx, 'SAI LẦM KINH ĐIỂN', BRAND.primary);
  captionAt(ctx, t, CAPS, true);
  progressBar(ctx, t);
  endCard(ctx, t, 17.6, false);
};
window.renderAt(0);
</script>
</body></html>
